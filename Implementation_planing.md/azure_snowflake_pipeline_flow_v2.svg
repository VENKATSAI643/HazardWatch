<svg width="100%" viewBox="0 0 720 820" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>HazardWatch — Azure + Snowflake + External Catalog Pipeline (v2)</title>
  <desc>
    Flow from public sources through Azure Functions to Raw ADLS (Iceberg External Volume).
    Snowflake reads via External Catalog (auto-refresh on manual uploads too).
    dbt builds Bronze, Silver, Gold inside Snowflake.
    Gold unloads to Published ADLS and Iceberg External Volume for consumers.
    Superset connects directly to Snowflake Gold.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#c2560c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 1: Public Sources -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="40" y="20" width="640" height="48" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="360" y="39" text-anchor="middle" dominant-baseline="central" fill="#444441" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Public Sources</text>
  <text x="360" y="56" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a" font-family="system-ui,sans-serif" font-size="11">USGS · GDACS · EONET · FIRMS · OpenAQ · Open-Meteo · WorldPop</text>

  <!-- arrows down to pollers -->
  <line x1="200" y1="68" x2="200" y2="90" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>
  <line x1="520" y1="68" x2="520" y2="90" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 2: Azure Functions (two boxes) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="40" y="92" width="310" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="195" y="110" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Timer Pollers</text>
  <text x="195" y="127" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" font-family="system-ui,sans-serif" font-size="11">Azure Functions, per-source cadence</text>

  <rect x="370" y="92" width="310" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="525" y="110" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Durable Backfills</text>
  <text x="525" y="127" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" font-family="system-ui,sans-serif" font-size="11">Retries, rate-limit timers, fan-out</text>

  <!-- arrows down to Raw ADLS -->
  <line x1="200" y1="144" x2="200" y2="166" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>
  <line x1="520" y1="144" x2="520" y2="166" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 3: Raw ADLS — now with Iceberg badge -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="40" y="168" width="640" height="72" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="360" y="188" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Raw Account (ADLS Gen2) — Iceberg External Volume</text>
  <text x="360" y="207" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" font-family="system-ui,sans-serif" font-size="11">Append-only Parquet + Iceberg metadata · Hive paths · Lifecycle TTL</text>

  <!-- Iceberg badge -->
  <rect x="265" y="218" width="190" height="18" rx="4" fill="#fff3e0" stroke="#c2560c" stroke-width="0.8"/>
  <text x="360" y="229" text-anchor="middle" dominant-baseline="central" fill="#c2560c" font-family="system-ui,sans-serif" font-size="10" font-weight="600">🗂 Iceberg catalog lives here (✓ correct position)</text>

  <!-- "also accepts manual uploads" note -->
  <rect x="40" y="218" width="210" height="18" rx="4" fill="#fef9e7" stroke="#b7950b" stroke-width="0.8"/>
  <text x="145" y="229" text-anchor="middle" dominant-baseline="central" fill="#7d6608" font-family="system-ui,sans-serif" font-size="10" font-weight="500">✋ Also accepts manual uploads</text>

  <!-- arrow down to External Catalog block -->
  <line x1="360" y1="240" x2="360" y2="264" marker-end="url(#arrow)" stroke="#c2560c" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 4: External Catalog / Event Grid Auto-refresh (NEW) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="40" y="266" width="640" height="64" rx="8" fill="#fff3e0" stroke="#c2560c" stroke-width="1.2"/>
  <text x="360" y="284" text-anchor="middle" dominant-baseline="central" fill="#7d2d00" font-family="system-ui,sans-serif" font-size="13" font-weight="700">External Catalog  ·  Snowflake External Volume + Iceberg Tables</text>
  <text x="360" y="302" text-anchor="middle" dominant-baseline="central" fill="#c2560c" font-family="system-ui,sans-serif" font-size="11">Event Grid → BlobCreated → AUTO REFRESH Iceberg Table in Snowflake</text>
  <text x="360" y="318" text-anchor="middle" dominant-baseline="central" fill="#c2560c" font-family="system-ui,sans-serif" font-size="10">Manual uploads instantly visible · No Snowpipe or COPY INTO required for raw reads</text>

  <!-- arrow down to Snowpipe (still exists for automated path) -->
  <line x1="240" y1="330" x2="200" y2="352" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>
  <!-- arrow down to Snowflake (external catalog path) -->
  <line x1="460" y1="330" x2="500" y2="352" marker-end="url(#arrow-orange)" stroke="#c2560c" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>

  <!-- labels on arrows -->
  <text x="180" y="345" text-anchor="middle" fill="#5f5e5a" font-family="system-ui,sans-serif" font-size="9">Snowpipe (automated)</text>
  <text x="548" y="345" text-anchor="middle" fill="#c2560c" font-family="system-ui,sans-serif" font-size="9">External Table read (manual + auto)</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 5: Event Grid + Snowpipe (automated path) -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="40" y="354" width="310" height="52" rx="8" fill="#eeeffe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="195" y="372" text-anchor="middle" dominant-baseline="central" fill="#3c3489" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Event Grid + Snowpipe</text>
  <text x="195" y="389" text-anchor="middle" dominant-baseline="central" fill="#534ab7" font-family="system-ui,sans-serif" font-size="11">Auto-ingest into landing tables (automated files)</text>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Snowflake bounding box -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="40" y="420" width="640" height="150" rx="12" fill="none" stroke="rgba(11,11,11,0.2)" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="360" y="440" text-anchor="middle" dominant-baseline="central" fill="#0b0b0b" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Snowflake on Azure — dbt Core job transforms data</text>

  <!-- arrows into Snowflake box from both paths -->
  <line x1="195" y1="406" x2="195" y2="456" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>
  <line x1="500" y1="380" x2="500" y2="456" marker-end="url(#arrow-orange)" stroke="#c2560c" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>

  <!-- Bronze -->
  <rect x="60" y="458" width="170" height="52" rx="8" fill="#eeeffe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="145" y="477" text-anchor="middle" dominant-baseline="central" fill="#3c3489" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Bronze</text>
  <text x="145" y="494" text-anchor="middle" dominant-baseline="central" fill="#534ab7" font-family="system-ui,sans-serif" font-size="11">Typed, deduped</text>

  <!-- Silver -->
  <rect x="275" y="458" width="170" height="52" rx="8" fill="#eeeffe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="360" y="477" text-anchor="middle" dominant-baseline="central" fill="#3c3489" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Silver</text>
  <text x="360" y="494" text-anchor="middle" dominant-baseline="central" fill="#534ab7" font-family="system-ui,sans-serif" font-size="11">Unified hazard_event</text>

  <!-- Gold -->
  <rect x="490" y="458" width="170" height="52" rx="8" fill="#eeeffe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="575" y="477" text-anchor="middle" dominant-baseline="central" fill="#3c3489" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Gold</text>
  <text x="575" y="494" text-anchor="middle" dominant-baseline="central" fill="#534ab7" font-family="system-ui,sans-serif" font-size="11">Exposure per event</text>

  <!-- arrows Bronze → Silver → Gold -->
  <line x1="230" y1="484" x2="273" y2="484" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>
  <line x1="445" y1="484" x2="488" y2="484" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Arrows out of Snowflake -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <line x1="145" y1="570" x2="145" y2="596" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>
  <line x1="480" y1="570" x2="480" y2="596" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 6: Superset + Published ADLS -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="40" y="598" width="210" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="145" y="617" text-anchor="middle" dominant-baseline="central" fill="#444441" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Superset</text>
  <text x="145" y="634" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a" font-family="system-ui,sans-serif" font-size="11">Connects to Snowflake directly</text>

  <rect x="280" y="598" width="400" height="52" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="480" y="617" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Published Account (ADLS Gen2)</text>
  <text x="480" y="634" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" font-family="system-ui,sans-serif" font-size="11">COPY INTO external stage · Parquet + Iceberg (Gold export)</text>

  <!-- arrow Published → R2 -->
  <line x1="390" y1="650" x2="390" y2="674" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- ROW 7: R2 + Open dataset users -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <rect x="280" y="676" width="180" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="370" y="695" text-anchor="middle" dominant-baseline="central" fill="#444441" font-family="system-ui,sans-serif" font-size="13" font-weight="600">R2 / GCS Mirror</text>
  <text x="370" y="712" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a" font-family="system-ui,sans-serif" font-size="11">Parquet only · free egress</text>

  <rect x="480" y="676" width="180" height="52" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="570" y="695" text-anchor="middle" dominant-baseline="central" fill="#444441" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Open Dataset Users</text>
  <text x="570" y="712" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a" font-family="system-ui,sans-serif" font-size="11">Spark · DuckDB · Snowflake</text>

  <!-- R2 → Open dataset -->
  <line x1="460" y1="702" x2="478" y2="702" marker-end="url(#arrow)" stroke="#898781" stroke-width="1.5" fill="none"/>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- Legend -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <text x="360" y="790" text-anchor="middle" fill="#52514e" font-family="system-ui,sans-serif" font-size="11">
    Teal = Azure storage/compute · Purple = Snowflake · Orange dashed = External Catalog path · Gray = external consumers
  </text>

  <!-- NEW badge -->
  <rect x="40" y="266" width="38" height="16" rx="4" fill="#c2560c"/>
  <text x="59" y="277" text-anchor="middle" dominant-baseline="central" fill="white" font-family="system-ui,sans-serif" font-size="9" font-weight="700">NEW</text>

  <!-- FIXED badge on Iceberg -->
  <rect x="458" y="218" width="42" height="16" rx="4" fill="#085041"/>
  <text x="479" y="229" text-anchor="middle" dominant-baseline="central" fill="white" font-family="system-ui,sans-serif" font-size="9" font-weight="700">FIXED</text>

</svg>
